# mesh-stl bundle patch: one plugin row.
#
# Portable defaults live in lib/common.js (DEFAULTS). Machine-specific settings
# belong to an external file:
#   ~/.config/mesh-stl/config.json   (or $XDG_CONFIG_HOME/mesh-stl/config.json,
#                                     or $MESH_STL_CONFIG=/path/to/config.json)
# Example:
#   { "projectRoot": "/path/to/Mesh_3D_pore_scale",
#     "python": "/path/to/Mesh_3D_pore_scale/.venv/bin/python" }
# Environment overrides: MESH_STL_PROJECT_ROOT, MESH_STL_PYTHON, MESH_STL_WORK_ROOT,
# MESH_STL_REGISTRY, MESH_STL_TIMEOUT_MS, MESH_STL_OPENFOAM_BASHRC, MESH_STL_OPENFOAM_ROOTS.
- insert:
    - id: mesh-stl
      name: mesh-stl
      config: {}
