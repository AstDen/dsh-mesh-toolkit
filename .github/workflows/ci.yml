name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: checks (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: node --check (all .js/.mjs)
        run: |
          mapfile -t files < <(find . \( -name '*.js' -o -name '*.mjs' \) -not -path '*/node_modules/*' | sort)
          for file in "${files[@]}"; do
            node --check "$file" || { echo "syntax error: $file"; exit 1; }
          done
          echo "checked ${#files[@]} files"

      - name: python syntax (packaged generators)
        run: python3 -m compileall -q mesh-stl/generators benchmark/scripts

      - name: shell syntax (packaged scripts)
        run: |
          for file in $(find mesh-build/scripts -name '*.sh' | sort); do
            bash -n "$file" || { echo "shell syntax error: $file"; exit 1; }
          done

      - name: catalogue and versions
        run: |
          node scripts/check-catalogue.mjs
          node scripts/check-versions.mjs

      - name: smoke (both packages, no DSH)
        run: |
          node mesh-stl/scripts/smoke.mjs
          node mesh-build/scripts/smoke.mjs

      - name: JS QA parity vs python reference
        run: |
          # trimesh needs networkx for split()/bodies; without it the reference engine dies
          # with "ImportError: no graph engines available!"
          python3 -m pip install --quiet --disable-pip-version-check trimesh numpy networkx
          node mesh-stl/scripts/qa-parity.mjs

      - name: package tarballs are complete
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          npm pack --pack-destination "$work" --cache "$work/cache" ./mesh-stl >/dev/null
          npm pack --pack-destination "$work" --cache "$work/cache" ./mesh-build >/dev/null
          stl_tgz="$(ls "$work"/mesh-stl-*.tgz)"
          build_tgz="$(ls "$work"/mesh-build-*.tgz)"
          # list once into a file: piping tar into `grep -q` trips SIGPIPE and prints
          # "tar: stdout: write error" even when the entry exists
          tar tzf "$stl_tgz" > "$work/mesh-stl.list"
          tar tzf "$build_tgz" > "$work/mesh-build.list"
          check() { grep -qx "$1" "$2" || { echo "MISSING $1 in $2"; exit 1; }; }
          check package/generators/pore_cell/gen_fcc_cell.py "$work/mesh-stl.list"
          check package/lib/qa/index.js "$work/mesh-stl.list"
          check package/lib/generators/box-array.js "$work/mesh-stl.list"
          check package/scripts/deliver/make_delivery.sh "$work/mesh-build.list"
          check package/docs/PORTABLE.md "$work/mesh-build.list"
          echo "tarballs OK"
